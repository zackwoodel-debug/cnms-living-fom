# Alembic configuration for CNMS Living FOM.
#
# The database URL is NOT stored here — env.py reads DATABASE_URL from the
# environment (via cnms_fom.config), so migrations always target the same
# database the application does and no credential ever lands in the repo.
#
#   alembic upgrade head        apply everything
#   alembic downgrade -1        step back one revision
#   alembic revision --autogenerate -m "..."   draft a new revision
#   alembic current             what this database is at

[alembic]
script_location = migrations
prepend_sys_path = backend
version_path_separator = os
# Revisions are numbered, not hashed, so the history reads in order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
